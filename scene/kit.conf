# build-kit.sh settings for the war table (sourced by scene/build.sh).
here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
repo="$(dirname "$here")"
KIT_SOURCE="$here/main.cpp"
KIT_OUT="$repo/web"
KIT_NAME=wartable-engine
KIT_EXPORT_NAME=createWartableEngine
KIT_EXPORTS=_wt_set_map,_wt_set_regions,_wt_set_banners,_wt_set_scouts
KIT_WORK="$repo/.strata/work"
